name: Offline product checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/flowsocial
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked public dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and operating system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Run checks and product tests without provider access
        run: npm run test:offline
